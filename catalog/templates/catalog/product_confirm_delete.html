{% extends 'base.html' %}
{% load blog_tags %}
{% block content %}
<div class="container mt-5 text-center">
    <h2 class="mb-4">Удаление товара!</h2>

    <p class="card-text">Вы уверены, что хотите удалить товар '{{ object.name }}'?</p>

    <form method="post" class="d-flex justify-content-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">Удалить</button>
        <a class="btn btn-secondary" href="{% url 'catalog:home' %}" role="button">Отмена</a>
    </form>
</div>
{% endblock %}
